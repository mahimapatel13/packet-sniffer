version: '3.8'

services:
  db:
    image: postgres:15-alpine
    container_name: traffic_db
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: traffic_analyzer
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d traffic_analyzer"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build: .
    container_name: traffic_backend
    restart: always
    environment:
      - DATABASE_URL=postgresql+asyncpg://postgres:postgres@db:5432/traffic_analyzer
      - REDIS_URL=redis://redis:6379/0
    # On Linux, host network mode allows the container to capture real packet interfaces from the host.
    # On Windows/macOS Docker, sniffing will capture the internal virtual network interface.
    network_mode: "host"
    # Alternatively, you can add raw net permissions
    cap_add:
      - NET_ADMIN
      - NET_RAW
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
